site_name: Unity ゲーム開発（後期）
docs_dir: docs/lessons     # 配布用 lessons/ 以下だけ
site_dir: output/docs
use_directory_urls: false   # file:// で開いてもリンクが切れないように

# lessons/ の中で配布しないもの
exclude_docs: |
  *.bak
  .DS_Store

# nav
nav:
   - 概要:
        - この授業について:
            - シラバス: index.md
            - 課題について: problems/index.md
        - セットアップ:
            - 授業用プロジェクトのセットアップ: s0-guidance/setup.md
            - 授業用プロジェクト構成の説明: s0-guidance/project-structure.md
            - 補足資料：使用アセット一覧: assets.md
   - 講義資料:
      - 目次:
          - 1章 3Dキャラクターの動作とカメラ制御:
            - IKとFK、AnimationRigging: s1-character-camera/ik-fk.md
            - Cinemachineとカメラ制御: s1-character-camera/cinemachine.md
            - Timeline(タイムライン)とカットシーン制作: s1-character-camera/timeline.md
            - 補足：Timelineの再生・停止とスキップ: s1-character-camera/timeline-playback.md
            - 補足：Custom TrackとBinding: s1-character-camera/timeline-custom-track.md
            - 補足資料①：3Dアニメーションの全体像: s1-character-camera/animation-overview.md
            - 補足資料②：Rig と Avatar: s1-character-camera/rig-avatar.md
            - 補足資料③：モーションの取り込みとコピー: s1-character-camera/motion-import.md
            - 補足資料④：アニメーションブレンド: s1-character-camera/animation-blend.md
          - 2章 キャラクターAIとState管理:
            - キャラクターAI（準備中）: s2-ai-state/character-ai.md
            - C#① Interface とポリモーフィズム（準備中）: s2-ai-state/interface-polymorphism.md
            - C#② 状態管理(Stateパターン)（準備中）: s2-ai-state/state-pattern.md
            - 補足資料：経路探索とA*（準備中）: s2-ai-state/pathfinding.md
          - 3章 グラフィックスとゲームの絵作り:
            - グラフィックス基礎① Lighting（準備中）: s3-graphics/lighting.md
            - グラフィックス基礎① Skybox（準備中）: s3-graphics/skybox.md
            - グラフィックス基礎② Shader(シェーダー)（準備中）: s3-graphics/shader.md
            - グラフィックス基礎③ PostProcess(ポストプロセス)（準備中）: s3-graphics/postprocess.md
            - グラフィックス基礎④ Rendering Pipeline（準備中）: s3-graphics/srp.md
            - 補足資料：座標・法線・UV・色（準備中）: s3-graphics/coordinates-color.md
          - 4章 C#の応用:
            - C#③ ObserverパターンとR3（準備中）: s4-csharp/r3.md
            - C#④ 設計への誘い MVPパターン（準備中）: s4-csharp/mvp.md
          - 5章 総合演習:
            - 総合演習（準備中）: s5-final/final-project.md
      - 付録:
        - New Input Systemの使い方: appendix/input-system.md
        - C#発展 CancellationTokenSourceとスキップ処理: appendix/unitask.md
        - delegate・event・購読の寿命（準備中）: appendix/events-lifetime.md
   - 課題:
      - 課題リスト:
        - 1章課題リスト: problems/s1/index.md
      - 各章課題ページ:
        - 1章問題集: 
            - １−１ 別のモーションで、振り下ろした瞬間に当てる: problems/s1/s1-1.md
            - １−２ 歩き → 走りの切り替わりをなめらかにする: problems/s1/s1-2.md
            - １−３ 走りながら上半身だけで攻撃する: problems/s1/s1-3.md
            - １−４ 手を伸ばして押すスイッチを作る: problems/s1/s1-4.md
            - １−５ 坂道や段差で、足を地面に合わせる: problems/s1/s1-5.md
            - １−６ 高台に上がったら、引きのカメラに切り替える: problems/s1/s1-6.md
            - １−７ 右クリックの間だけ、肩越しの構えカメラにする: problems/s1/s1-7.md
            - １−８ 追従カメラを自分で書いて、Cinemachine と比べる: problems/s1/s1-8.md
            - １−９ 敵を見ながら戦えるロックオンカメラを作る: problems/s1/s1-9.md
            - １−１０ 文字の登場に間をつけて、タイトル演出を作る: problems/s1/s1-10.md
            - １−１１ ボス登場のカメラと動きを、Blendでつなぐ: problems/s1/s1-11.md
            - １−１２ Signalで、演出の決めどころに反応を起こす: problems/s1/s1-12.md
            - １−１３ 演出をスキップしても、操作できる状態へ戻す: problems/s1/s1-13.md
            - １−１４ 同じ演出を別の対象にも使えるCustom Trackを作る: problems/s1/s1-14.md


# theme
theme:
  name: material
  language: ja
  custom_dir: src/overrides
  font: false               # Google Fonts を読まない（オフライン用）
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/brightness-7, name: ダークモードへ }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/brightness-4, name: ライトモードへ }
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

plugins:
  - search:
      lang: ja
  - offline                 # file:// でも検索が動く

# 外部 CDN を読まない（オフライン用）。どちらも src/overrides/assets/javascripts/ に同梱
#   iframe-worker：file:// で検索を動かすための shim（offline プラグインが既定で unpkg から読むのを差し替え）
extra:
  polyfills:
    - assets/javascripts/iframe-worker-shim.js
extra_javascript:
  - assets/javascripts/mermaid.min.js

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
